<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f7a55">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Financeiro">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Financeiro</title><!-- v3 -->
<style>
:root{--bg:#f3f5f2;--card:#fff;--tx:#1b2620;--mut:#6c7b73;--bd:#e3e8e3;--pri:#0f7a55;--red:#c8372b;--red2:#fbe4e1;--amb:#e09a0b;--blu:#2f6fd6;--bar:#e9eee9;--rd:16px;--pad:14px;--ff:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1512;--card:#18211d;--tx:#e8efe9;--mut:#93a39a;--bd:#29352f;--red:#ef7a6b;--red2:#3a1f1c;--amb:#f0b73c;--blu:#7aa7f5;--bar:#25302a}}
:root[data-theme="dark"]{--bg:#0f1512;--card:#18211d;--tx:#e8efe9;--mut:#93a39a;--bd:#29352f;--red:#ef7a6b;--red2:#3a1f1c;--amb:#f0b73c;--blu:#7aa7f5;--bar:#25302a}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:15px/1.4 var(--ff);padding-bottom:86px}
.pri2{background:color-mix(in srgb,var(--pri) 14%,var(--card))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);padding:10px 14px;display:flex;align-items:center;gap:8px}
.top h1{font-size:20px;font-weight:800;margin:0;flex:1;letter-spacing:-.3px}
.mes{display:flex;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:12px}.mes button{border:0;background:none;width:32px;height:34px;font-size:18px;color:var(--tx)}.mes span{min-width:96px;text-align:center;font-size:13px;font-weight:700;text-transform:capitalize}
.ic{border:1px solid var(--bd);background:var(--card);border-radius:12px;width:38px;height:36px;font-size:16px}
main{padding:4px 14px;max-width:760px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--rd);padding:var(--pad);margin-bottom:12px}
.card h2{font-size:14px;font-weight:800;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}.card h2 small{color:var(--mut);font-weight:500;font-size:12px}
.hero{background:linear-gradient(135deg,var(--pri),color-mix(in srgb,var(--pri) 60%,#000));color:#fff;border-radius:calc(var(--rd) + 2px);padding:16px;margin-bottom:12px}.hero small{opacity:.85;font-size:12px}.hero>b{display:block;font-size:30px;font-weight:800;margin:2px 0 10px}.hero .r{display:flex;gap:16px;font-size:12px}.hero .r b{font-size:14px;display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{grid-template-columns:repeat(3,1fr)}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:calc(var(--rd) - 2px);padding:10px}.kpi small{color:var(--mut);display:block;font-size:11px}.kpi b{font-size:15px;font-weight:800}
.pos{color:var(--pri)}.neg{color:var(--red)}
input,select,button,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;min-width:0}
textarea{width:100%;min-height:64px;resize:vertical}
button{cursor:pointer;font-weight:600}button.p{background:var(--pri);color:#fff;border-color:var(--pri);font-weight:700}button.d{background:var(--red2);color:var(--red);border-color:var(--red2)}button.arm{background:var(--red)!important;color:#fff!important}
label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin-bottom:10px}label input,label select{width:100%;display:block;margin-top:4px;font-weight:400}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:6}
nav button{border:0;background:none;flex:1;font-size:10.5px;padding:5px 1px;color:var(--mut);border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:1px}nav button i{font-style:normal;font-size:18px}nav button.on{background:color-mix(in srgb,var(--pri) 14%,var(--card));color:var(--pri);font-weight:800}
.seg{display:flex;background:var(--bar);border-radius:12px;padding:3px;margin-bottom:12px;gap:2px;overflow-x:auto}.seg button{flex:1 0 auto;border:0;background:none;border-radius:10px;padding:8px 12px;font-size:13px;color:var(--mut);white-space:nowrap}.seg button.on{background:var(--card);color:var(--tx);font-weight:800;box-shadow:0 1px 3px #0002}
.item{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--bd)}.item:last-child{border:0}
.av{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px;flex:none;background:color-mix(in srgb,var(--pri) 14%,var(--card))}
.item .m{flex:1;min-width:0;cursor:pointer}.item .m b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item .m span{color:var(--mut);font-size:12px}
.item .v{font-weight:800;white-space:nowrap;text-align:right}.item .v small{display:block;font-weight:400;color:var(--mut);font-size:11px}
.sm{padding:6px 10px;font-size:12px;border-radius:9px}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:9px;background:color-mix(in srgb,var(--pri) 14%,var(--card));color:var(--pri);white-space:nowrap}.tag.w{background:#fbeccb;color:#8a5a00}.tag.r{background:var(--red2);color:var(--red)}
.bar{height:9px;background:var(--bar);border-radius:6px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;border-radius:6px;background:var(--pri)}
.bl{display:flex;justify-content:space-between;font-size:13px;margin-top:10px;gap:8px}
.empty{color:var(--mut);text-align:center;padding:18px;font-size:13px}
.fab{position:fixed;right:16px;bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:7;background:var(--pri);color:#fff;border:0;border-radius:28px;padding:14px 20px;font-weight:800;box-shadow:0 6px 18px #0004}
.ov{position:fixed;inset:0;background:#0007;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0 0 12px;font-size:16px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.leg{display:flex;flex-direction:column;gap:6px;font-size:13px;flex:1;min-width:0}.leg div{display:flex;justify-content:space-between;gap:6px}.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.dn{display:flex;gap:14px;align-items:center}.dn svg{width:130px;flex:none}
.alert{background:#fbeccb;color:#6b4500;border-radius:12px;padding:9px 12px;font-size:13px;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.chip{background:color-mix(in srgb,var(--pri) 14%,var(--card));color:var(--pri);font-weight:600;padding:4px 6px 4px 10px;border-radius:14px;font-size:13px}.chip button{border:0;background:none;padding:0 4px;color:inherit}
.bk{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}.bk button{flex:none;border-radius:20px;padding:7px 14px;font-size:13px}.bk button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.sw{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.sw button{width:34px;height:34px;border-radius:50%;padding:0;border:3px solid var(--card);box-shadow:0 0 0 1px var(--bd)}.sw button.on{box-shadow:0 0 0 2px var(--tx)}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:6px 3px;text-align:right}th:first-child,td:first-child{text-align:left}th{color:var(--mut);font-weight:600}tr+tr td{border-top:1px solid var(--bd)}
.note{background:color-mix(in srgb,var(--pri) 12%,var(--card));border-radius:10px;padding:8px 10px;font-size:13px;margin-bottom:10px}
svg text{fill:var(--mut);font-size:9px;font-family:inherit}
body.cmp{--pad:10px}body.cmp .item{padding:7px 0}
body{font-family:var(--f-txt);font-weight:var(--w-txt)}
h1,.card h2,.sheet h3,.hero small{font-family:var(--f-tit);font-weight:var(--w-tit)}
.kpi b,.hero>b,.hero .r b,.item .v,.bl b{font-family:var(--f-val);font-weight:var(--w-val)}
nav button{font-family:var(--f-menu);font-weight:var(--w-menu)}
.pos{color:var(--pos,var(--pri))}nav{background:var(--menu,var(--card))}
.hero{background:var(--hero-bg,linear-gradient(135deg,var(--pri),color-mix(in srgb,var(--pri) 60%,#000)))}
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 62px);left:50%;transform:translate(-50%,-20px);opacity:0;pointer-events:none;background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:700;font-size:14px;z-index:30;max-width:90%;text-align:center;transition:.25s}.toast.on{opacity:1;transform:translate(-50%,0)}
</style></head><body>
<div class="top"><h1>Financeiro</h1><div class="mes" id="mesbox"><button onclick="mv(-1)">‹</button><span id="mn"></span><button onclick="mv(1)">›</button></div><button class="ic" id="eye" onclick="S.cfg.hide=!S.cfg.hide;save();render()">👁</button></div>
<main id="app"></main><div id="fabw"></div><div id="modal"></div><nav id="nav"></nav>
<script>
const KEY='fin-dividas-v1';
const D0=()=>new Date().toISOString().slice(0,10);
const uid=()=>Math.random().toString(36).slice(2,9);
const def={cfg:{mes:D0().slice(0,7),rate:120,dias:25,divIni:12000,meta:0,cor:'#0f7a55',fonte:'padrao',tema:'auto',dens:'conf',cards:'arred',hide:false},
lists:{fixo:['Moradia','Contas da casa','Saúde','Transporte','Assinaturas','Educação','Outros'],pess:['Alimentação','Delivery/iFood','Lazer','Compras pessoais','Jogos/entretenimento','Compras por impulso','Transporte','Saúde','Outros'],pay:['Pix','Débito','Crédito','Dinheiro','Boleto','Transferência','Outro'],tipo:['Necessidade','Desejo'],bancos:['Nubank','Inter','Itaú','Banco do Brasil','Santander','Caixa','Bradesco','Outro']},
itens:{fixo:{'Moradia':['Aluguel','Condomínio','IPTU'],'Contas da casa':['Água','Luz','Gás','Internet','Celular'],'Saúde':['Plano de saúde','Remédios'],'Transporte':['Financiamento','Seguro','Combustível'],'Assinaturas':['Streaming','Academia'],'Educação':['Escola','Curso']},
pess:{'Alimentação':['Mercado','Padaria','Lanche'],'Delivery/iFood':['iFood'],'Lazer':['Passeio','Cinema'],'Compras pessoais':['Roupas','Cosméticos'],'Transporte':['Uber','Combustível'],'Saúde':['Farmácia']}},
orc:{},bobs:{},renda:[],div:[],fixo:[],pess:[]};
let S;try{S=JSON.parse(localStorage.getItem(KEY))||def}catch(e){S=def}
S={...def,...S,cfg:{...def.cfg,...S.cfg},lists:{...def.lists,...S.lists},itens:{...def.itens,...S.itens},bobs:S.bobs||{}};
if(S.lists.cats){delete S.lists.cats}
S.div.forEach(x=>{if(!x.pags){x.pags=(+x.valor>0)?[{id:uid(),valor:+x.valor,data:x.data||'',mes:(x.data||D0()).slice(0,7)}]:[];x.orig=(+x.saldo||0)+(+x.valor||0);x.desc=x.desc||x.obs||'';x.juros=x.juros||0;x.venc=x.venc||'';delete x.valor;delete x.data}});
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let tab='inicio',gsub='fixo',modal=null,arm=null,dsel=-1,csel={fixo:'',pess:''},cfgsub='aparencia',note='';
const PAL=['#0f7a55','#2f6fd6','#e09a0b','#c8372b','#8e5bd6','#14a3b8','#d6578a','#7d8a2e','#a0643a','#5b6b78','#3aa655','#c47a1d'];
const L=()=>S.lists;
const nf=n=>(+n||+n===0&&n!=='')?(+n).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}):'';
const R=n=>fmtR(n);
const Rk=n=>S.cfg.hide?'•••':Math.abs(n)>=1000?(n/1000).toFixed(1).replace('.',',')+'k':Math.round(n);
const num=s=>parseFloat(String(s).replace(/\./g,'').replace(',','.'))||0;
function mask(el){let v=el.value.replace(/[^\d,]/g,'');let[i,...d]=v.split(',');i=i.replace(/^0+(?=\d)/,'').replace(/\B(?=(\d{3})+(?!\d))/g,'.');el.value=d.length?i+','+d.join('').slice(0,2):i}
const MI=(v,ex='')=>`data-money inputmode="decimal" oninput="mask(this)" value="${v?nf(v):''}" ${ex}`;
const sum=a=>a.reduce((s,x)=>s+(+x.valor||0),0);
const ym=d=>(d||'').slice(0,7),dm=d=>fmtD(d);
const dmes=x=>ym(x.data)||x.mes;
function mk(off){let[y,m]=S.cfg.mes.split('-').map(Number);m+=off;while(m<1){m+=12;y--}while(m>12){m-=12;y++}return y+'-'+String(m).padStart(2,'0')}
const mfix=m=>S.fixo.filter(x=>(ym(x.pago||x.venc)||x.mes)===m),mpes=m=>S.pess.filter(x=>dmes(x)===m),mren=m=>S.renda.filter(x=>ym(x.data)===m);
const pagsAll=()=>S.div.flatMap(d=>d.pags.map(p=>({...p,banco:d.banco,tipo:d.tipo})));
const mpag=m=>pagsAll().filter(p=>dmes(p)===m);
const aberto=x=>(+x.saldo||0)>0;
function T(m){const f=sum(mfix(m)),p=sum(mpes(m)),r=sum(mren(m)),d=sum(mpag(m));return{f,p,g:f+p,r,d,sobra:r-f-p-d,dt:mren(m).filter(x=>x.trab==='Sim').length}}
const mname=(m,o)=>new Date(m+'-15T12:00').toLocaleDateString('pt-BR',o||{month:'long',year:'numeric'});
function mv(n){S.cfg.mes=mk(n);save();render()}
const allCats=()=>[...new Set([...L().fixo,...L().pess])];
// charts
function donut(items){const tot=items.reduce((s,i)=>s+i[1],0);if(!tot)return '<div class="empty">Sem gastos neste mês.</div>';let off=25;
const arcs=items.map(([k,v],i)=>{const p=v/tot*100,s=`<circle r="15.9155" cx="21" cy="21" fill="none" stroke="${PAL[i%12]}" stroke-width="6" stroke-dasharray="${p} ${100-p}" stroke-dashoffset="${off}"/>`;off-=p;return s}).join('');
return `<div class="dn"><svg viewBox="0 0 42 42"><circle r="15.9155" cx="21" cy="21" fill="none" stroke="var(--bar)" stroke-width="6"/>${arcs}<text x="21" y="20.5" text-anchor="middle" style="font-size:4px">Total</text><text x="21" y="26" text-anchor="middle" style="font-size:4.6px;font-weight:700;fill:var(--tx)">${Rk(tot)}</text></svg><div class="leg">${items.slice(0,7).map(([k,v],i)=>`<div><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap"><i class="dot" style="background:${PAL[i%12]}"></i>${k}</span><b>${Math.round(v/tot*100)}%</b></div>`).join('')}</div></div>`}
function dailyChart(m){const[y,mo]=m.split('-').map(Number),n=new Date(y,mo,0).getDate(),v=Array(n+1).fill(0),w=Array(n+1).fill(false);
mren(m).forEach(x=>{const d=+x.data.slice(8,10);v[d]+=+x.valor||0;if(x.trab==='Sim')w[d]=true});const mx=Math.max(1,...v),bw=300/n;
return `<svg viewBox="0 0 320 110">${[0,.5,1].map(f=>`<line x1="16" x2="318" y1="${90-f*80}" y2="${90-f*80}" stroke="var(--bd)"/>`).join('')}<text x="0" y="14">${Rk(mx)}</text><text x="0" y="93">0</text>${v.slice(1).map((x,i)=>{const h=x/mx*80;return `<rect x="${18+i*bw*.98}" y="${90-h}" width="${Math.max(2,bw*.7)}" height="${Math.max(h,w[i+1]?2:0)}" rx="2" fill="${w[i+1]?'var(--pri)':'var(--bar)'}"/>`}).join('')}${[1,8,15,22,n].map(d=>`<text x="${18+(d-1)*bw*.98}" y="104">${d}</text>`).join('')}</svg>`}
function monthsChart(){const ms=[-5,-4,-3,-2,-1,0].map(mk),ds=ms.map(T),mx=Math.max(1,...ds.flatMap(d=>[d.r,d.g,d.d])),col=[['r','var(--pri)'],['g','var(--amb)'],['d','var(--blu)']];
return `<svg viewBox="0 0 320 130">${[0,.5,1].map(f=>`<line x1="22" x2="318" y1="${100-f*84}" y2="${100-f*84}" stroke="var(--bd)"/>`).join('')}<text x="0" y="20">${Rk(mx)}</text><text x="0" y="103">0</text>${ds.map((d,i)=>col.map(([k,c],j)=>{const h=d[k]/mx*84;return `<rect x="${28+i*48+j*12}" y="${100-h}" width="10" height="${h}" rx="2" fill="${c}"/>`}).join('')+`<text x="${28+i*48+18}" y="118" text-anchor="middle">${mname(ms[i],{month:'short'}).replace('.','')}</text>`).join('')}</svg><div class="bl" style="justify-content:center;gap:14px;font-size:12px"><span><i class="dot" style="background:var(--pri)"></i>Ganhos</span><span><i class="dot" style="background:var(--amb)"></i>Gastos</span><span><i class="dot" style="background:var(--blu)"></i>Dívidas pagas</span></div>`}
function hbars(items){const mx=Math.max(1,...items.map(i=>i[1]));return items.map(([k,v,c])=>`<div class="bl" style="margin-top:9px"><span>${k}</span><b>${R(v)}</b></div><div class="bar"><i style="width:${v/mx*100}%;background:${c||'var(--pri)'}"></i></div>`).join('')}
// pages
function inicio(){const m=S.cfg.mes,t=T(m),pm=T(mk(-1)),cats={};[...mfix(m),...mpes(m)].forEach(x=>cats[x.cat]=(cats[x.cat]||0)+(+x.valor||0));
const bk={};S.div.filter(aberto).forEach(x=>bk[x.banco]=(bk[x.banco]||0)+(+x.saldo||0));const saldo=Object.values(bk).reduce((a,b)=>a+b,0);
const desn=sum(mpes(m).filter(x=>x.nec==='Não')),dif=pm.g?Math.round((t.g-pm.g)/pm.g*100):null;
return `<div class="hero"><small>Sobra do mês · ${mname(m)}</small><b>${R(t.sobra)}</b><div class="r"><div><small>Ganhos</small><b>${R(t.r)}</b></div><div><small>Gastos</small><b>${R(t.g)}</b></div><div><small>Dívidas pagas</small><b>${R(t.d)}</b></div></div></div>
${t.sobra<0?'<div class="alert">⚠️ O que entrou neste mês não cobre gastos + dívidas.</div>':''}${desn>0?`<div class="alert">💡 ${R(desn)} em gastos marcados como "não necessário".</div>`:''}${dif!==null?`<div class="note">${dif>0?'📈':'📉'} Gastos ${dif>0?'subiram':'caíram'} ${Math.abs(dif)}% vs. mês anterior.</div>`:''}
<div class="card"><h2>Gastos por categoria <small>${R(t.g)}</small></h2>${donut(Object.entries(cats).sort((a,b)=>b[1]-a[1]))}</div>
<div class="card"><h2>Fixos × Pessoais</h2>${hbars([['Gastos fixos',t.f,'var(--pri)'],['Gastos pessoais',t.p,'var(--amb)']])}</div>
<div class="card"><h2>Ganhos por dia <small>${t.dt}/${S.cfg.dias} dias</small></h2>${dailyChart(m)}<div class="bar"><i style="width:${Math.min(100,t.dt/S.cfg.dias*100)}%"></i></div></div>
<div class="card"><h2>Últimos 6 meses</h2>${monthsChart()}</div>
<div class="card"><h2>Dívidas por banco <small>${R(saldo)} em aberto</small></h2>${Object.keys(bk).length?hbars(Object.entries(bk).sort((a,b)=>b[1]-a[1]).map(([k,v],i)=>[k,v,PAL[(i+3)%12]])):'<div class="empty">Cadastre suas dívidas na aba Dívidas.</div>'}</div>`}
function geral(){const m=S.cfg.mes,t=T(m),c=S.cfg,est=c.rate*c.dias,pago=sum(pagsAll()),q=S.div.reduce((s,x)=>s+(+x.saldo||0),0),base=c.divIni||S.div.reduce((s,x)=>s+(+x.orig||0),0),prog=base?Math.min(100,pago/base*100):0;
const real={};[...mfix(m),...mpes(m)].forEach(x=>real[x.cat]=(real[x.cat]||0)+(+x.valor||0));
return `<div class="card"><h2>Parâmetros</h2><div class="grid"><label>Renda por dia (R$)<input ${MI(c.rate,'onchange="cf(\'rate\',this.value)"')}></label><label>Dias de trabalho/mês<input type="number" value="${c.dias}" onchange="cf('dias',this.value)"></label></div><label style="margin:0">Total inicial das dívidas (R$)<input ${MI(c.divIni,'onchange="cf(\'divIni\',this.value)"')}></label></div>

${ds.length?`<div class="card"><h2>Se eu não pagar nada <small>projeção</small></h2>${projTable(ds)}<div class="bl"><span>Total hoje</span><b>${R(ds.reduce((s,x)=>s+x.saldo,0))}</b></div><div class="bl"><span>Total em 12 meses</span><b class="neg">${R(ds.reduce((s,x)=>s+proj(x.saldo,x.juros,12),0))}</b></div></div>`:''}`}
